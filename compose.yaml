services:
  arafno:
    build: .
    image: arafno-nowcast:local
    restart: unless-stopped
    stop_grace_period: 20m
    user: "${ARAFNO_UID:?Set ARAFNO_UID to your host user ID}:${ARAFNO_GID:?Set ARAFNO_GID to your host group ID}"
    env_file: .env
    volumes:
      - ./artifacts/v1:/app/artifacts/v1
      - ./outputs:/app/outputs
